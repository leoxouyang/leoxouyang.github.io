name: Deploy to GitHub Pages

on:
  # Deploy every time you push to the `main` branch
  push:
    branches: [main]
  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:
  # Allow the markdown-resume repository to trigger a redeploy
  repository_dispatch:
    types: [update-resume]

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---- Private resume tool at /resume/ (not linked from the site) ----
      - name: Setup Node for resume build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Clone resume repo
        run: |
          rm -rf /tmp/markdown-resume
          git clone https://github.com/leoxouyang/markdown-resume.git /tmp/markdown-resume

      - name: Build resume
        working-directory: /tmp/markdown-resume
        env:
          NUXT_APP_BASE_URL: '/resume/'
          NUXT_PUBLIC_SITE_URL: 'https://leoxouyang.github.io'
        run: |
          pnpm install
          pnpm build:pkg
          pnpm build

      - name: Copy resume into Astro public/
        run: |
          mkdir -p public/resume
          cp -R /tmp/markdown-resume/site/.output/public/* public/resume/
          touch public/resume/.nojekyll
          cp public/resume/index.html public/resume/404.html
      # --------------------------------------------------------------------

      - name: Install, build, and upload site
        uses: withastro/action@v6
        # Uses Node 24 by default (some Astro dependencies require Node >= 24)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
